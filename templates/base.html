<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevLog {% block title %}{% endblock %}</title>
    <style>
        :root {
            --bg: #f6f7fb;
            --panel: #ffffff;
            --ink: #172033;
            --muted: #667085;
            --line: #d9dee8;
            --brand: #1f7a6d;
            --brand-dark: #155c52;
            --danger: #b42318;
            --success: #087443;
            --warn: #ad6f00;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
        }

        a { color: var(--brand); text-decoration: none; }
        a:hover { text-decoration: underline; }

        .topbar {
            background: var(--panel);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .nav {
            align-items: center;
            display: flex;
            justify-content: space-between;
            margin: 0 auto;
            max-width: 1100px;
            padding: 14px 20px;
        }

        .brand {
            color: var(--ink);
            display: inline-flex;
            flex-direction: column;
            font-weight: 800;
            line-height: 1.05;
            text-decoration: none;
        }

        .brand span {
            color: var(--muted);
            font-size: 12px;
            font-weight: 600;
            margin-top: 3px;
        }

        .nav-actions { align-items: center; display: flex; gap: 10px; }

        .page {
            margin: 0 auto;
            max-width: 1100px;
            padding: 28px 20px 56px;
        }

        .shell {
            display: grid;
            gap: 18px;
        }

        .hero {
            align-items: end;
            background: linear-gradient(135deg, #123d39, #1f7a6d 62%, #f0b45b);
            color: white;
            display: grid;
            min-height: 230px;
            padding: 34px;
        }

        .hero h1 {
            font-size: clamp(30px, 5vw, 54px);
            letter-spacing: 0;
            line-height: 1;
            margin: 0 0 12px;
            max-width: 780px;
        }

        .hero p {
            color: rgba(255, 255, 255, .86);
            margin: 0;
            max-width: 680px;
        }

        .grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(12, minmax(0, 1fr));
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 22px;
        }

        .span-4 { grid-column: span 4; }
        .span-6 { grid-column: span 6; }
        .span-8 { grid-column: span 8; }
        .span-12 { grid-column: span 12; }

        .auth-panel {
            margin: 26px auto 0;
            max-width: 520px;
        }

        h1, h2, h3 { line-height: 1.15; margin: 0 0 12px; }
        p { margin: 0 0 14px; }
        .muted { color: var(--muted); }
        .small { font-size: 13px; }

        .form-row { margin-bottom: 16px; }
        label { display: block; font-weight: 700; margin-bottom: 6px; }

        input, textarea, select {
            background: white;
            border: 1px solid #cbd3df;
            color: var(--ink);
            display: block;
            font: inherit;
            min-height: 42px;
            padding: 10px 12px;
            width: 100%;
        }

        textarea { resize: vertical; }
        .otp-input { font-size: 24px; font-weight: 800; letter-spacing: 0; text-align: center; }

        .field-error, .errorlist {
            color: var(--danger);
            font-size: 13px;
            list-style: none;
            margin: 6px 0 0;
            padding: 0;
        }

        .btn {
            align-items: center;
            border: 1px solid transparent;
            cursor: pointer;
            display: inline-flex;
            font: inherit;
            font-weight: 800;
            justify-content: center;
            min-height: 40px;
            padding: 9px 14px;
            text-decoration: none;
        }

        .btn:hover { text-decoration: none; }
        .btn-primary { background: var(--brand); color: white; }
        .btn-primary:hover { background: var(--brand-dark); }
        .btn-secondary { background: #eef2f6; border-color: var(--line); color: var(--ink); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-block { width: 100%; }

        .actions { display: flex; flex-wrap: wrap; gap: 10px; }

        .alert {
            border-left: 4px solid var(--brand);
            margin-bottom: 16px;
            padding: 12px 14px;
        }

        .alert-success { background: #ecfdf3; border-color: var(--success); color: #054f31; }
        .alert-error, .alert-danger { background: #fff1f0; border-color: var(--danger); color: #7a271a; }
        .alert-info { background: #eff8ff; border-color: #1570ef; color: #1849a9; }
        .alert-warning { background: #fffaeb; border-color: var(--warn); color: #7a4d00; }

        .endpoint {
            align-items: start;
            border-top: 1px solid var(--line);
            display: grid;
            gap: 8px;
            grid-template-columns: 78px 1fr;
            padding: 12px 0;
        }

        .method {
            background: #e8f3f1;
            color: var(--brand-dark);
            font-size: 12px;
            font-weight: 900;
            padding: 4px 7px;
            text-align: center;
        }

        code {
            background: #f1f4f8;
            color: #233044;
            display: inline-block;
            font-family: "Cascadia Code", Consolas, monospace;
            font-size: 13px;
            padding: 2px 5px;
        }

        .status-list {
            display: grid;
            gap: 10px;
            margin: 0;
            padding: 0;
        }

        .status-list li {
            align-items: center;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            list-style: none;
            padding-top: 10px;
        }

        @media (max-width: 760px) {
            .nav { align-items: flex-start; gap: 12px; }
            .nav-actions { flex-wrap: wrap; justify-content: flex-end; }
            .hero { padding: 24px; }
            .span-4, .span-6, .span-8 { grid-column: span 12; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <nav class="nav">
            <a class="brand" href="{% url 'home' %}">DevLog<span>auth and OTP verification</span></a>
            <div class="nav-actions">
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' %}" class="btn btn-secondary">{{ user.username }}</a>
                    <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-secondary">Login</a>
                    <a href="{% url 'register' %}" class="btn btn-primary">Register</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main class="page">
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
